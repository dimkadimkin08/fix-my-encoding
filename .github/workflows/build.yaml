name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            aot: true
          - os: macos-latest
            rid: osx-x64
            aot: true
          - os: ubuntu-latest
            rid: linux-x64
            aot: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish                                                                                                                                        
          -c Release                                                                                                                                            
          -r ${{ matrix.rid }}                                                                                                                                  
          --self-contained true                                                                                                                                 
          -p:PublishSingleFile=true
          -p:PublishAot=${{ matrix.aot }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FixMyEncoding-${{ matrix.rid }}
          path: bin/Release/net10.0/${{ matrix.rid }}/publish/
